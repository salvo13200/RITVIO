name: Feature request
description: Suggest an improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behaviour and alternatives
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Both, Windows, Android]
