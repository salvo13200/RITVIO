name: Feature request
description: Suggest an improvement
body:
  - type: textarea
    id: context
    attributes:
      label: App context
      description: Platform and app version, if opened from Settings.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behaviour and alternatives
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [All platforms, Windows, Android, iOS beta]
