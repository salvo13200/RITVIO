name: Bug report
description: Report a reproducible problem in RITVIO
body:
  - type: markdown
    attributes:
      value: Please remove account details, tokens, private playlist data and personal paths from logs. For vulnerabilities, read SECURITY.md.
  - type: textarea
    id: context
    attributes:
      label: App context
      description: Filled by the app when available. It includes platform and version only; please verify it.
  - type: input
    id: version
    attributes:
      label: RITVIO version
      description: Copy the exact app or release version. For Windows, also specify installer, portable ZIP or self-extracting EXE.
      placeholder: Exact version and package type
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Windows
        - Both Android and Windows
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and OS version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected behaviour and actual behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional diagnostics or screenshots
      description: For playback problems, copied playback diagnostics are useful. Remove signed stream URLs, tokens, personal paths and private data; do not upload your library database.
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Only once so far
        - Not sure
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues and removed private data.
          required: true
