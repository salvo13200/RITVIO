name: iOS native verification
on:
  push:
    branches: ['codex/ios-*']
    paths:
      - 'apps/mobile/**'
      - 'packages/i18n/**'
      - 'scripts/*ios*'
      - 'scripts/mobile-platform.*'
      - 'tests/ios-foundation.test.ts'
      - 'tests/ios*'
      - 'third-party/ios/**'
      - 'build-resources/icon.png'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ios-preview.yml'
  workflow_dispatch:
    inputs:
      full_ui:
        description: Include native UI/language captures on both iPhone sizes
        type: boolean
        default: true
      live_provider:
        description: Also require real-provider stream acceptance (may be rejected by the provider)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    name: iOS native build and player (provider check opt-in)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: python3 tests/ios_package_test.py
      - run: pnpm exec tsx --test tests/ios-foundation.test.ts tests/ios-library.test.ts
      - run: pnpm exec playwright install chromium
      - run: pnpm exec playwright test --config tests/config/playwright.ios5.config.ts
      - run: node scripts/prepare-ios-resolver.mjs
      - run: python3 tests/ios_resolver_test.py
      - run: xcodebuild -version
      - if: github.event_name != 'workflow_dispatch' || inputs.full_ui
        name: Native UI, player and resolver core (live provider optional)
        env:
          CHECK_LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.live_provider }}
        run: |
          if [ "$CHECK_LIVE" = "true" ]; then
            pnpm ios:build --smoke
          else
            pnpm ios:build --smoke --skip-live
          fi
      - if: github.event_name == 'workflow_dispatch' && !inputs.full_ui
        env:
          CHECK_LIVE: ${{ inputs.live_provider }}
        run: |
          if [ "$CHECK_LIVE" = "true" ]; then
            pnpm ios:build --smoke --resolver-only
          else
            pnpm ios:build --smoke --resolver-only --skip-live
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: RITVIO-iOS-${{ github.sha }}
          path: .local/ios/artifacts/
          if-no-files-found: error
          retention-days: 5
