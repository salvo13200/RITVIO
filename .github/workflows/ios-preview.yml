name: iOS foundation
on:
  push:
    branches: ['codex/ios-*']
    paths:
      - 'apps/mobile/**'
      - 'packages/i18n/**'
      - 'scripts/*ios*'
      - 'scripts/mobile-platform.*'
      - 'tests/ios-foundation.test.ts'
      - 'build-resources/icon.png'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ios-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    name: iOS simulator and unsigned device build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec tsx --test tests/ios-foundation.test.ts
      - run: xcodebuild -version
      - run: pnpm ios:build --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: RITVIO-IOS-1-${{ github.sha }}
          path: .local/ios/artifacts/
          if-no-files-found: error
          retention-days: 5
