name: Windows preview
on:
  push:
    branches: ['codex/**']
    paths:
      - '.github/workflows/windows-preview.yml'
      - 'apps/api/**'
      - 'apps/client/**'
      - 'apps/desktop/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'requirements-resolver.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows EXEs and isolated installer test
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:resolver
      - run: pnpm release:check
      - run: pnpm check:assets
      - run: pnpm check:docs
      - run: pnpm check:architecture
      - run: pnpm check:locales
      - run: pnpm i18n:check
      - run: pnpm exec tsx --test --test-concurrency=2 tests/*.test.ts
      - run: pnpm exec playwright install msedge
      - run: pnpm exec playwright test --config tests/config/playwright.playback.config.ts
      - run: pnpm package:windows
      - name: Isolated installer lifecycle
        run: node tests/installer-lifecycle.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: RITVIO-Windows-preview-${{ github.sha }}
          path: |
            release/*.exe
            release/*.exe.sha256
            release/*-portatile.zip
            release/*-portatile.zip.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
