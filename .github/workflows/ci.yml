name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core and web
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:resolver
      - run: pnpm release:check
      - run: pnpm check:assets
      - run: pnpm check:docs
      - run: pnpm check:architecture
      - run: pnpm check:locales
      - run: pnpm i18n:check
      - run: pnpm exec tsx --test --test-concurrency=2 tests/*.test.ts
      - run: .venv/Scripts/python.exe tests/home-catalog.test.py
      - run: .venv/Scripts/python.exe tests/radio-catalog.test.py
      - run: python tests/mobile-discovery.test.py
      - run: pnpm build
      - run: pnpm --dir apps/mobile build
  browser:
    name: Browser regression
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install msedge
      - run: pnpm exec playwright test --list
      - run: pnpm exec playwright test --config tests/config/playwright.localization.config.ts
      - run: pnpm exec playwright test --config tests/config/playwright.home.config.ts
      - run: pnpm exec playwright test --config tests/config/playwright.mobile-artwork.config.ts
