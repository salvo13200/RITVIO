name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core and web
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:resolver
      - run: pnpm release:check
      - run: pnpm check:assets
      - run: pnpm check:docs
      - run: pnpm downloads:check
      - run: pnpm check:architecture
      - run: pnpm check:locales
      - run: pnpm i18n:check
      - run: pnpm exec tsx --test --test-concurrency=2 tests/*.test.ts
      - run: .venv/Scripts/python.exe tests/home-catalog.test.py
      - run: .venv/Scripts/python.exe tests/radio-catalog.test.py
      - run: python tests/mobile-discovery.test.py
      - run: python tests/ios_package_test.py
      - run: pnpm build
      - run: pnpm --dir apps/mobile build
      - run: pnpm site:build
  browser-suites:
    name: Browser suites (${{ matrix.suite }})
    runs-on: windows-latest
    timeout-minutes: 20
    # Each group gets a fresh Windows VM to limit cross-suite browser/socket
    # accumulation after an observed ERR_NO_BUFFER_SPACE in the previous job.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        suite: [interface, updates-and-site, playback, sharing-and-support]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install msedge
      - run: pnpm exec playwright test --list
      - if: matrix.suite == 'interface'
        run: pnpm exec playwright test --config tests/config/playwright.localization.config.ts --trace retain-on-failure
      - if: matrix.suite == 'interface'
        run: pnpm exec playwright test --config tests/config/playwright.home.config.ts --trace retain-on-failure
      - if: matrix.suite == 'interface'
        run: pnpm exec playwright test --config tests/config/playwright.mobile-artwork.config.ts --trace retain-on-failure
      - if: matrix.suite == 'interface'
        run: pnpm exec playwright test --config tests/config/playwright.listening-tools.config.ts --grep-invert 'capture:' --trace retain-on-failure
      - if: matrix.suite == 'updates-and-site'
        run: pnpm exec playwright test --config tests/config/playwright.updates.config.ts --trace retain-on-failure
      - if: matrix.suite == 'updates-and-site'
        run: pnpm test:site --trace retain-on-failure
      - if: matrix.suite == 'updates-and-site'
        run: pnpm exec playwright test --config tests/config/playwright.first-use.config.ts --trace retain-on-failure
      - if: matrix.suite == 'playback'
        run: pnpm test:playback --trace retain-on-failure
      - if: matrix.suite == 'playback'
        run: pnpm exec playwright test --config tests/config/playwright.continuity.config.ts --trace retain-on-failure
      - if: matrix.suite == 'sharing-and-support'
        run: pnpm exec playwright test --config tests/config/playwright.sharing-discovery.config.ts --trace retain-on-failure
      - if: matrix.suite == 'sharing-and-support'
        run: pnpm exec playwright test --config tests/config/playwright.support.config.ts --grep-invert 'capture:' --trace retain-on-failure
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: RITVIO-browser-failure-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  browser:
    # Keep the required check name unchanged. It is green only if every matrix
    # group passed; failed/cancelled/skipped groups must not permit a merge.
    name: Browser regression
    needs: browser-suites
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all browser suites to pass
        env:
          BROWSER_SUITE_RESULT: ${{ needs.browser-suites.result }}
        run: test "$BROWSER_SUITE_RESULT" = success
