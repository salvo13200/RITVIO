name: iOS 12 PC-assisted test candidate
on:
  push:
    branches: ['codex/ios12-*']
    paths: ['apps/ios12-test/**', 'scripts/*ios12*', 'tests/ios12*', '.github/workflows/ios12-pc-test.yml', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios12-pc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-14
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec tsx --test tests/ios12-pc-service.test.ts
      - run: pnpm exec vite build --config apps/ios12-test/vite.config.ts
      - run: python3 scripts/build-ios12-test.py
      - run: python3 scripts/check-ios12-candidate.py .local/ios12/artifacts/RITVIO-iOS12-PC-Test-0.1.0-unsigned.ipa .local/ios12/artifacts/compatibility.json
      - run: python3 scripts/build-ios12-test.py --simulator
      - run: python3 scripts/capture-ios12-test.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: RITVIO-iOS12-PC-${{ github.sha }}
          path: .local/ios12/artifacts/
          if-no-files-found: error
          retention-days: 5
